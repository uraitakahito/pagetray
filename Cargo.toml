# サーバー（この folder）と、crates/ の下の crate を 1 つの workspace にする。版・license などは下の [workspace.package] の 1 か所。
[package]
name = "pagetray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# サーバーの binary。人が打つ CLI（crates/cli）が `pagetray` の名を使うので、こちらは pagetray-server。
[[bin]]
name = "pagetray-server"
path = "src/main.rs"

# AI-36 の作り直しの間は、新しい server（crates/server。Smithy の定義 model/ から作った骨 crates/pagetray-sdk/ を使う）を並べて作る。
# 切り替えまで、image に入るのは今の server（この crate）だけ。
[workspace]
members = [".", "crates/api", "crates/cli", "crates/pagetray-sdk", "crates/castlist-client"]
# 生成した crate（crates/pagetray-sdk/・crates/castlist-client/）は手で直さないので、既定の cargo の命令（clippy・test）からは外す。
# その中の、定義の例から作った試験（protocol の試験）は、CI が `cargo test --locked -p pagetray_sdk`・`-p castlist_client` で流す。
# fmt は生成器が整えた物を、CI の `cargo fmt --all --check` が見る（ci/gen.sh は rust-toolchain.toml の rustfmt で整える）。
default-members = [".", "crates/api", "crates/cli"]

# 版はここだけに書く（release の workflow が、この file の初めの `version = "…"` の行を tag と突き合わせる）。
[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[dependencies]
pagetray-api = { path = "crates/api" }
askama = "0.16.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# file の中身の SHA-256。sqlx が使う版と同じ物（lock に前からある）。
sha2 = { version = "0.11.1", default-features = false }
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
# 問い合わせごとの記録（method・path・status・かかった時間）。
tower-http = { version = "0.7", default-features = false, features = ["trace"] }
# 時刻つきの記録。書き先は stdout と、大きさで回す file（src/runlog.rs）。
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
