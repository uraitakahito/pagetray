# ページの置き場（pagetray）。crate はみな crates/ の下にあり、版・license などは下の [workspace.package] の 1 か所。
# server は crates/server（binary pagetray-server。release の image（Containerfile）に入る。Smithy の定義 model/ から作った骨
# crates/pagetray-sdk/ を使う）。人が打つ CLI は crates/cli（binary pagetray。release に付ける。定義から作った client
# crates/pagetray-client/ で呼ぶ）。
[workspace]
members = ["crates/cli", "crates/server", "crates/pagetray-sdk", "crates/castlist-client", "crates/pagetray-client"]
resolver = "3"
# 生成した crate（crates/pagetray-sdk/・crates/castlist-client/・crates/pagetray-client/）は手で直さないので、既定の cargo の命令
# （clippy・test）からは外す。その中の、定義の例から作った試験（protocol の試験）は、CI が `cargo test --locked -p pagetray_sdk`・
# `-p castlist_client`・`-p pagetray_client` で流す。
# fmt は生成器が整えた物を、CI の `cargo fmt --all --check` が見る（ci/gen.sh は rust-toolchain.toml の rustfmt で整える）。
default-members = ["crates/cli", "crates/server"]

# 版はここだけに書く（release の workflow が、この file の初めの `version = "…"` の行を tag と突き合わせる）。
[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
