# 新しい pagetray の server（crates/server・binary pagetray-next）を呼ぶ、人が打つ CLI（AI-36）。
# 生成した操作は、定義（model/）から作った client（crates/pagetray-client/）で呼ぶ。手の道（ページの本文・file の中身・
# 新着の知らせ・直に呼ぶ api）は、同じ HTTP の client（aws-smithy-http-client の hyper の作り）で直に呼ぶ（docs/src/next.md の「CLI」）。
# 切り替えまで、今の CLI（crates/cli・binary pagetray）と並べる。release には入らない。
[package]
name = "pagetray-cli-next"
description = "ページの置き場（pagetray）を端末から操作する CLI（新しい API 向け）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# server の binary の名（pagetray-next）とぶつけない。
[[bin]]
name = "pagetray-cli-next"
path = "src/main.rs"

[dependencies]
# 名・path・file の種類と中身の見方の決まり（今の CLI と共に使う）。
pagetray-api = { path = "../api" }
pagetray_client = { path = "../pagetray-client" }
# TLS の無い HTTP/1.1（build_http）だけを使うので、features は default-client だけ（crates/server と同じ）。
aws-smithy-http-client = { version = "1.5.3", default-features = false, features = ["default-client"] }
aws-smithy-runtime-api = { version = "1.22.0", features = ["client", "http-1x"] }
aws-smithy-types = { version = "1.9.4", features = ["http-body-1-x"] }
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# signal は backup の書きかけを、止める合図で消すため。macros は select!。
tokio = { version = "1.54", features = ["rt", "time", "signal", "macros"] }

[dev-dependencies]
# 試験は、同じ commit の新しい server を起こして、build した pagetray-cli-next を打つ。
pagetray-next = { path = "../server" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "net"] }
# 試験の材料は、同じ Router に直に要求を通して置く。
tower = { version = "0.5", features = ["util"] }
