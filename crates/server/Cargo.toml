# pagetray の server。定義（model/）から作った骨（crates/pagetray-sdk/）に処理を入れ、
# 手の道（ページと file の本文・新着の知らせ・backup・logs）と 1 つの axum の Router に並べる。画面は持たない（2.0.0 から）。
# binary は pagetray-server（src/main.rs）。release の image（Containerfile）に /pagetray-server の名で入る。
[package]
name = "pagetray-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pagetray_sdk = { path = "../pagetray-sdk" }
# castlist に送り手を聞く client（castlist の定義から作った物）と、それに渡す HTTP の client。
# TLS の無い HTTP/1.1（hyper の作りの build_http）だけを使うので、features は default-client だけ（rustls・s2n は入れない）。
castlist_client = { path = "../castlist-client" }
aws-smithy-http-client = { version = "1.5.3", default-features = false, features = ["default-client"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
aws-smithy-types = "1.9.4"
bytes = "1"
# 新着の知らせの流れを、止める合図で閉じる（take_until。tokio-stream には無い）。lock に前からある版（axum が使う物）。
futures-util = { version = "0.3", default-features = false }
http-body = "1"
http-body-util = "0.1"
serde_json = "1"
# file の中身の SHA-256。sqlx が使う版と同じ物。
sha2 = { version = "0.11.1", default-features = false }
# SQL は動く時に組む形（query・query_as）だけを使う（.sqlx/ は要らない）。macros は、移行の SQL を埋め込む migrate!() のため。
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
# signal は binary の止める合図。
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time", "sync"] }
# 新着の知らせ（SSE）を broadcast の channel から流す。
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
# backup の file を読みながら送る（io）と、止める合図の印（CancellationToken）。
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
# 問い合わせごとの記録（method・path・status・かかった時間）。
tower-http = { version = "0.7", default-features = false, features = ["trace"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# 時刻つきの記録。書き先は stdout と、大きさで回す file（src/runlog.rs）。
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
