name: release
# tag（v<版>）を打つと、image と CLI を作り、確かめてから、image を ghcr.io に置き、CLI を release に付ける。
#
# image も、release に付ける CLI も public になる。だから、確かめ（check・check-cli）と置く（push）を別の job にし、
#   - check: 書き込みの権限を持たない。image の build・中身の一覧・設定・秘密の走査・動くかを見て、image を file にして渡す
#   - check-cli: 書き込みの権限を持たない。CLI（macOS・arm64）の build・形・library・版・秘密の走査・動くかを見て、tar にして渡す
#   - push: check と check-cli が通った時だけ動く。渡された file（確かめたその image と tar）を、作り直さずに置く
# とする。確かめが 1 つでも落ちれば、push は動かず、何も外に出ない。image も CLI も手で出さない（docs/src/release.md の「release を出す」）。
#
# image は server（crates/server）の Containerfile で作り、API の形で動くかを見る。release に付ける CLI は crates/cli（binary pagetray）。
# tag に「-rc.」の付く物（v<版>-rc.<n>）は、GitHub の pre-release にする。
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  IMAGE: ghcr.io/${{ github.repository }}
  # 秘密の走査の道具。ci.yml と同じ値にする。
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
  # 同じ版の、macOS（darwin_arm64）用の値。check-cli が使う。
  GITLEAKS_DARWIN_SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
# action は commit の SHA で固定する（tag は後から中身が替わりうる）。
jobs:
  check:
    # 動かす Mac と同じ CPU の種類（arm64）で作る。
    runs-on: ubuntu-24.04-arm
    outputs:
      sha256: ${{ steps.save.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: tag が Cargo.toml の版と同じで、main の上にあるか
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME と Cargo.toml の版 $version が違う" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag が main の上に無い" >&2; exit 1; }
          grep -q "^## $version\$" CHANGELOG.md || { echo "CHANGELOG.md に $version の節が無い" >&2; exit 1; }
      # 出どころの記録（provenance・SBOM）は付けない。付ける時は、中身を見てから。
      # label は、もう public な値の 3 つだけ（ci/check-image.sh が名を突き合わせる）。ARG・--build-arg・--secret は使わない。
      - name: image を作る
        run: |
          docker build --provenance=false --sbom=false -f Containerfile -t pagetray:release \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            .
      - name: gitleaks を入れる（版と checksum を固定）
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
      - name: image に、入ってよい物だけが入っているか（中身の一覧・設定・秘密の走査）
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          ci/check-image.sh pagetray:release | tee "$RUNNER_TEMP/out/image-report.md"
      - name: 空の image の中で起き、API で置いて読めて、断る答えが restJson1 の形で、止めて起こし直しても残るか
        run: ci/smoke-image.sh pagetray:release
      - name: 確かめた image を file にする
        id: save
        run: |
          docker save pagetray:release | gzip > "$RUNNER_TEMP/out/image.tar.gz"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/out/image.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-image
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error
  check-cli:
    # 出す CLI は macOS の arm64 用。CI の job `cli` と同じ script で作って確かめる（PR で動いた物が、そのまま動く）。
    runs-on: macos-15
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # RUSTFLAGS は ci/build-cli.sh が決める（この action の既定の -D warnings を入れない）。
          rustflags: ""
      - name: gitleaks を入れる（版と checksum を固定）
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          echo "${GITLEAKS_DARWIN_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # build に秘密は要らない。この job は secrets を 1 つも読まない。出どころの記録（provenance）も付けない。
      - name: CLI を作る（runner の path を binary に入れない）
        run: ci/build-cli.sh
      - name: binary に、入ってよい物だけが入っているか（形・library・版・秘密の走査）
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          ci/check-cli.sh target/release/pagetray | tee "$RUNNER_TEMP/out/cli-report.md"
      - name: その binary を、同じ commit のサーバーに向けて打つ
        run: PAGETRAY_TEST_BIN="$PWD/target/release/pagetray" cargo test --locked -p pagetray
      - name: 確かめた binary を tar にする（中身の一覧と持ち主も見る）
        id: pack
        run: |
          ci/pack-cli.sh target/release/pagetray "$GITHUB_REF_NAME" "$RUNNER_TEMP/out"
          echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/out/pagetray-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-cli
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error
  push:
    needs: [check, check-cli]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write # release を作る
      packages: write # image を置く
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked-image
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked-cli
          path: cli
      - name: 渡された file が、確かめた物と同じか
        env:
          WANT: ${{ needs.check.outputs.sha256 }}
          WANT_CLI: ${{ needs.check-cli.outputs.sha256 }}
        run: |
          echo "$WANT  out/image.tar.gz" | sha256sum -c -
          echo "$WANT_CLI  cli/pagetray-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz" | sha256sum -c -
          (cd cli && sha256sum -c "pagetray-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz.sha256")
          gunzip -c out/image.tar.gz | docker load
      - name: ghcr.io に置く（同じ tag がもうあれば置かない）
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE:$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$IMAGE:$GITHUB_REF_NAME は、もうある。同じ tag を置き直さない（版を上げて出し直す）" >&2
            exit 1
          fi
          docker tag pagetray:release "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$GITHUB_REF_NAME" | grep -m1 "^$IMAGE@" | cut -d@ -f2)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: 置いた物を digest で取り直せるか
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker rmi "$IMAGE:$GITHUB_REF_NAME" pagetray:release
          docker pull "$IMAGE@$DIGEST"
          docker logout ghcr.io
      - name: release を作る
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
          CLI_SHA256: ${{ needs.check-cli.outputs.sha256 }}
        run: |
          {
            echo "image: \`$IMAGE:$GITHUB_REF_NAME\`"
            echo
            echo "digest: \`$DIGEST\`"
            echo
            case "$GITHUB_REF_NAME" in
              *-rc.*) echo "rc: 次の版の候補（pre-release）。"; echo ;;
            esac
            echo "変えたことは [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)。"
            echo
            cat out/image-report.md
            echo
            echo "CLI（macOS・arm64）: \`pagetray-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz\`"
            echo
            echo "sha256: \`$CLI_SHA256\`"
            echo
            cat cli/cli-report.md
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          # 付けるのは、check-cli が確かめて渡した tar と、その checksum の 2 つだけ。rc（tag に「-rc.」が付く）は pre-release にする。
          prerelease=()
          case "$GITHUB_REF_NAME" in *-rc.*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${prerelease[@]}" \
            "cli/pagetray-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz" \
            "cli/pagetray-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz.sha256"
